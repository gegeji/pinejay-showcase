<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pinejay demo</title>
  <meta name="description" content="Pinejay demo. Data is generated locally in your browser.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../assets/pinejay-icon-64.png">
  <link rel="apple-touch-icon" href="../assets/pinejay-icon-180.png">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="banner" id="banner" role="note"></div>
